name: okno
services:
  db:
    image: postgis/postgis:17-3.6
    platform: linux/amd64
    environment:
      POSTGRES_USER: okno
      POSTGRES_PASSWORD: okno
      POSTGRES_DB: okno
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U okno -d okno]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    platform: linux/amd64
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: ${DB_URL:-postgresql://okno:okno@db:5432/okno}
      LLM_MODE: ${LLM_MODE:-offline}
    ports:
      - "8080:8080"
    volumes:
      - runtime:/app/runtime
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped
volumes:
  pgdata:
  runtime:

