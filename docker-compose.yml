name: okno
services:
  db:
    image: postgis/postgis:17-3.6
    platform: linux/amd64
    environment:
      POSTGRES_USER: okno
      POSTGRES_PASSWORD: okno
      POSTGRES_DB: okno
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U okno -d okno]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build: .
    platform: linux/amd64
    # .env.example is always present and gives the defaults; an optional .env overrides
    # them through interpolation below. Short env_file syntax works on any Compose v2.
    env_file:
      - .env.example
    environment:
      APP_PORT: ${APP_PORT:-8080}
      DB_URL: ${DB_URL:-postgresql://okno:okno@db:5432/okno}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODE: ${LLM_MODE:-offline}
      LLM_STRUCTURED_MODE: ${LLM_STRUCTURED_MODE:-auto}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-12}
    ports:
      - "8080:8080"
    volumes:
      - runtime:/app/runtime
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    restart: unless-stopped
volumes:
  pgdata:
  runtime:

