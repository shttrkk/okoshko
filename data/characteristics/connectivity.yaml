id: connectivity
version: 1
name_ru: Связь для работы
display_name: Связь для работы
description: Сведения OSM о сообщённом наличии интернета на объекте и агрегированные
  тесты Ookla в районе. OSM не измеряет скорость или работоспособность сети; Ookla
  не подтверждает Wi-Fi конкретного номера.
category: Работа
synonyms:
- связь
- интернет
- удалёнка
- работать
- 4g
- 5g
scope: hotel
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    internet_access:
      type:
      - string
      - 'null'
      description: Исходное значение OSM internet_access без вывода о скорости
    wifi_reported:
      type:
      - boolean
      - 'null'
      description: Сообщает ли OSM WLAN; неизвестный тип подключения остаётся null
    fee:
      type:
      - string
      - 'null'
    download_mbps:
      type:
      - number
      - 'null'
      minimum: 0
    upload_mbps:
      type:
      - number
      - 'null'
      minimum: 0
    latency_ms:
      type:
      - number
      - 'null'
      minimum: 0
    kind:
      type: string
    measurement:
      type: boolean
    statement:
      type: string
    wifi_in_rooms:
      type:
      - boolean
      - 'null'
      description: Отель прямо сообщил о Wi-Fi в номерах; скорость требует отдельного значения
  additionalProperties: true
  x-hotelier:
    substantive_fields:
    - wifi_in_rooms
    - wifi_reported
    - fee
    - download_mbps
    - upload_mbps
    - latency_ms
methods:
- tool: connectivity
  params: {}
  rationale: Сведения OSM о сообщённом наличии интернета на объекте и агрегированные
    тесты Ookla в районе. OSM не измеряет скорость или работоспособность сети; Ookla
    не подтверждает Wi-Fi конкретного номера.
  when: null
combine: null
ttl_days: 180
change_triggers: []
search:
  kind: numeric
  field: download_mbps
  default_op: gte
  default_value: 30
  explain_ok: Связь для работы — условие выполнено
  explain_bad: Связь для работы — условие не выполняется
hotelier_answerable: true
status: active
