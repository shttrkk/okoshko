id: pets
version: 1
name_ru: С питомцем
display_name: С питомцем
description: С питомцем — подтверждённые данные с указанием источника и ограничений
category: Доступ
synonyms:
- с собакой
- питомец
- с кошкой
- лабрадор
- животные
scope: hotel
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    species:
      type: array
      items:
        enum:
        - dog
        - cat
    excluded_species:
      type: array
      items:
        enum:
        - dog
        - cat
    max_weight_kg:
      type:
      - number
      - 'null'
      exclusiveMinimum: 0
      maximum: 100
    fee_rub_night:
      type:
      - number
      - 'null'
      minimum: 0
      maximum: 100000
    permission_period_unknown:
      type: boolean
  additionalProperties: true
  x-hotelier:
    substantive_fields:
    - species
    - excluded_species
    - max_weight_kg
    - fee_rub_night
    availability_from:
      field: species
      value: true
      unless:
      - permission_period_unknown
methods:
- tool: hotelier_ask
  params: {}
  rationale: С питомцем — подтверждённые данные с указанием источника и ограничений
  when: null
combine: null
ttl_days: 90
change_triggers: []
search:
  kind: boolean
  field: available
  default_op: eq
  default_value: true
  explain_ok: С питомцем — условие выполнено
  explain_bad: С питомцем — условие не выполняется
hotelier_answerable: true
status: active
