id: night_open
version: 1
name_ru: Магазин и еда ночью
display_name: Магазин и еда ночью
description: Открытые в 02:00 магазины и еда. Только распознанные ежедневные часы;
  рядом означает не более 15 минут по пешему графу.
category: Окружение
synonyms:
- круглосуточный магазин рядом
- где поесть ночью
- магазин ночью
scope: hotel
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    shop: &id001
      type:
      - object
      - 'null'
      properties:
        available:
          type:
          - boolean
          - 'null'
        minutes:
          type:
          - number
          - 'null'
        distance_m:
          type:
          - number
          - 'null'
        ascent_m:
          type:
          - number
          - 'null'
        has_steps:
          type:
          - boolean
          - 'null'
        crossings:
          type: array
          items:
            type: object
      additionalProperties: true
    food: *id001
    open_at:
      const: 02:00
  required:
  - available
  additionalProperties: true
methods:
- tool: prepared_observation
  params:
    kind: night_open
    near_minutes: 15
    snap_limit_m: 120
  rationale: Открытые в 02:00 магазины и еда. Только распознанные ежедневные часы;
    рядом означает не более 15 минут по пешему графу.
ttl_days: 90
change_triggers:
- kind: source_snapshot_changed
search:
  kind: boolean
  field: available
  default_op: eq
  default_value: true
  explain_ok: Магазин и еда ночью — есть данные по карте
  explain_bad: Условие не подтверждено рассчитанным значением; отсутствие данных остаётся
    неизвестным
hotelier_answerable: false
status: active
