id: accessible_route
version: 1
name_ru: Доступность маршрута до пляжа для коляски
display_name: Доступность маршрута до пляжа для коляски
description: 'Сведения о маршруте до пляжа: известные лестницы означают, что путь не подходит для коляски. Отсутствие лестниц с известными подъёмом и переходами — только предварительные данные; бордюры, ширина и соединения у входов не проверены. Полную доступность уточняет отель.'
category: Доступность
synonyms:
- маршрут для инвалидной коляски
- доступный маршрут до пляжа
- пляж на инвалидной коляске
- доступность пути для коляски
scope: hotel
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    distance_m:
      type:
      - number
      - 'null'
    has_steps:
      type:
      - boolean
      - 'null'
    wheelchair_suitable:
      type:
      - boolean
      - 'null'
    entrance_ramp:
      type:
      - boolean
      - 'null'
      description: Отель сообщил о пандусе у входа; сам по себе не подтверждает весь маршрут
  additionalProperties: true
  x-hotelier:
    substantive_fields:
    - has_steps
    - wheelchair_suitable
    - entrance_ramp
methods:
- tool: geo_trait
  params:
    kind: accessible_route
  rationale: 'Сведения о маршруте до пляжа: известные лестницы означают, что путь не подходит для коляски. Отсутствие лестниц с известными подъёмом и переходами — только предварительные данные; бордюры, ширина и соединения у входов не проверены. Полную доступность уточняет отель.'
ttl_days: 90
change_triggers: []
search:
  kind: boolean
  field: available
  default_op: eq
  default_value: true
  explain_ok: Доступность всего маршрута для коляски подтверждена входными данными
  explain_bad: На маршруте явно отмечено wheelchair=no
hotelier_answerable: true
status: active
