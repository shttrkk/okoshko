id: beach_surface
version: 1
name_ru: Покрытие пляжа на маршруте
description: Явный тег surface пляжа из сохранённого пешего маршрута. Если маршрута
  нет — ближайший картированный OSM пляж по прямой с явной пометкой. Нет тега — unknown.
  Не подтверждает доступ, качество воды или вход в море.
category: Пляж
synonyms:
- покрытие пляжа
- тип пляжа
- песчаный пляж
- галечный пляж
- песок на пляже
- галька на пляже
scope: hotel
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    distance_m:
      type:
      - number
      - 'null'
    surface:
      type:
      - string
      - 'null'
    beach_id:
      type:
      - string
      - 'null'
    selection_kind:
      type: string
  additionalProperties: true
methods:
- tool: geo_trait
  params:
    kind: beach_surface
  rationale: Явный тег surface пляжа из сохранённого пешего маршрута. Если маршрута
    нет — ближайший картированный OSM пляж по прямой с явной пометкой. Нет тега —
    unknown. Не подтверждает доступ, качество воды или вход в море.
ttl_days: 90
change_triggers: []
search:
  kind: categorical
  field: surface
  default_op: eq
  default_value: sand
  explain_ok: На пляже маршрута (или ближайшем картированном) указан песок
  explain_bad: Явно указанное покрытие выбранного пляжа отличается от песка
hotelier_answerable: true
status: active
