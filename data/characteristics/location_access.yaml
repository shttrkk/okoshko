id: location_access
version: 1
name_ru: Расположение и транспорт
display_name: Расположение и транспорт
description: 'Центральный район — точный административный полигон. Центры — явно выбранные
  публичный ориентир на площади Флага (Центральный район) и OSM place points остальных районов; подходы по настоящему пешему графу, missing path остаётся unknown.
  Метро: датированный перечень Росстата на конец 2024 года.'
category: Окружение
synonyms: []
scope: hotel
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    in_central_sochi:
      type:
      - boolean
      - 'null'
    district_id:
      type:
      - string
      - 'null'
    district_name:
      type:
      - string
      - 'null'
    zone_center:
      type:
      - object
      - 'null'
    center_route: &id001
      type:
      - object
      - 'null'
      properties:
        available:
          type:
          - boolean
          - 'null'
        minutes:
          type:
          - number
          - 'null'
        distance_m:
          type:
          - number
          - 'null'
        ascent_m:
          type:
          - number
          - 'null'
        has_steps:
          type:
          - boolean
          - 'null'
        crossings:
          type: array
          items:
            type: object
      additionalProperties: true
    station_route: *id001
    bus_stop_route: *id001
    metro:
      type: object
      properties:
        available:
          const: false
        observed_at:
          type: string
        source_url:
          type: string
      required:
      - available
      - observed_at
      - source_url
  additionalProperties: true
methods:
- tool: prepared_observation
  params:
    kind: location_access
  rationale: 'Центральный район — точный административный полигон. Центры — явно выбранные
    публичный ориентир на площади Флага (Центральный район) и OSM place points остальных районов; подходы по настоящему пешему графу, missing path остаётся unknown.
    Метро: датированный перечень Росстата на конец 2024 года.'
ttl_days: 90
change_triggers:
- kind: source_snapshot_changed
search:
  kind: boolean
  field: in_central_sochi
  default_op: eq
  default_value: true
  explain_ok: Расположение и транспорт — явное условие подтверждено источником
  explain_bad: Расположение и транспорт — условие не подтверждено; пропуски остаются
    неизвестными
hotelier_answerable: false
status: active
