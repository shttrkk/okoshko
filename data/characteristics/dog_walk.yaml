id: dog_walk
version: 1
name_ru: Площадка для выгула
display_name: Площадка для выгула
description: Пеший маршрут до площадки для выгула. Обычный парк показан отдельно;
  правила приёма животных отеля неизвестны.
category: Окружение
synonyms:
- площадка для выгула
- выгул собаки рядом
scope: hotel
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    dog_park: &id001
      type:
      - object
      - 'null'
      properties:
        available:
          type:
          - boolean
          - 'null'
        minutes:
          type:
          - number
          - 'null'
        distance_m:
          type:
          - number
          - 'null'
        ascent_m:
          type:
          - number
          - 'null'
        has_steps:
          type:
          - boolean
          - 'null'
        crossings:
          type: array
          items:
            type: object
      additionalProperties: true
    ordinary_park_fallback: *id001
  required:
  - available
  additionalProperties: true
methods:
- tool: prepared_observation
  params:
    kind: dog_walk
    near_minutes: 15
    snap_limit_m: 120
  rationale: Пеший маршрут до площадки для выгула. Обычный парк показан отдельно;
    правила приёма животных отеля неизвестны.
ttl_days: 90
change_triggers:
- kind: source_snapshot_changed
search:
  kind: boolean
  field: available
  default_op: eq
  default_value: true
  explain_ok: Площадка для выгула — есть данные по карте
  explain_bad: Условие не подтверждено рассчитанным значением; отсутствие данных остаётся
    неизвестным
hotelier_answerable: false
status: active
