id: car_arrival
version: 1
name_ru: Подъезд к отелю
display_name: Подъезд к отелю
description: Проезжая дорога не дальше 30 м от отмеченного входа или контура здания.
  Геометрическая оценка не подтверждает открытый въезд.
category: Окружение
synonyms:
- подъехать к входу
- подъезд к отелю
scope: hotel
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    road_distance_m:
      type:
      - number
      - 'null'
    private_parking:
      type:
      - boolean
      - 'null'
    arrival_anchor:
      type:
      - string
      - 'null'
  required:
  - available
  additionalProperties: true
methods:
- tool: prepared_observation
  params:
    kind: car_arrival
    arrival_threshold_m: 30
  rationale: Проезжая дорога не дальше 30 м от отмеченного входа или контура здания.
    Геометрическая оценка не подтверждает открытый въезд.
ttl_days: 90
change_triggers:
- kind: source_snapshot_changed
search:
  kind: numeric
  field: road_distance_m
  default_op: lte
  default_value: 30
  explain_ok: Подъезд к отелю — есть данные по карте
  explain_bad: Условие не подтверждено рассчитанным значением; отсутствие данных остаётся
    неизвестным
hotelier_answerable: false
status: active
