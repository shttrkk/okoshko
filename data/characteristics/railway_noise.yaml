id: railway_noise
version: 1
name_ru: Железнодорожный шум
description: Отдельный некалиброванный прокси наружного шума картированных железных
  дорог по фасаду. Не измерение дБ и не шумоизоляция; нет расписаний и потоков поездов.
  Отсутствие источника означает unknown.
category: Шум
synonyms:
- шум железной дороги
- железнодорожный шум
- шум поездов
- тише от железной дороги
- жд шум
scope: facade
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    night_db_min:
      type:
      - number
      - 'null'
    night_db_max:
      type:
      - number
      - 'null'
    day_db_min:
      type:
      - number
      - 'null'
    day_db_max:
      type:
      - number
      - 'null'
  additionalProperties: true
methods:
- tool: geo_trait
  params:
    kind: railway_noise
  rationale: Отдельный некалиброванный прокси наружного шума картированных железных
    дорог по фасаду. Не измерение дБ и не шумоизоляция; нет расписаний и потоков поездов.
    Отсутствие источника означает unknown.
ttl_days: 90
change_triggers: []
search:
  kind: numeric
  field: night_db_max
  default_op: lte
  default_value: 50
  explain_ok: Верхняя граница прокси железнодорожного шума до 50 дБ
  explain_bad: Верхняя граница прокси железнодорожного шума выше 50 дБ
  unit: дБ, модельный прокси
hotelier_answerable: true
status: active
