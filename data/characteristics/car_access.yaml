id: car_access
version: 1
name_ru: На машине
description: Общедоступная парковка OSM не дальше 500 м и зарядка для электромобиля не дальше 1000 м по прямой; собственная парковка отеля и въезд к двери не подтверждаются
category: Доступ
synonyms:
- парковка
- на машине
- подъехать
- электромобиль
- зарядка
scope: hotel
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
  additionalProperties: true
methods:
- tool: poi_nearby
  params:
    kind: car
  rationale: На машине — подтверждённые данные с указанием источника и ограничений
  when: null
combine: null
ttl_days: 180
change_triggers: []
search:
  kind: numeric
  field: parking_distance_m
  default_op: lte
  default_value: 500
  explain_ok: Общедоступная парковка по OSM в пределах порога
  explain_bad: Ближайшая парковка по OSM дальше порога
hotelier_answerable: false
status: active
