id: airport_transfer
version: 1
name_ru: Дорога из аэропорта
display_name: Дорога из аэропорта
description: Связность OSM маршрутов с 0–1 пересадкой; пешие участки по графу. Без
  GTFS время и ночное движение неизвестны.
category: Окружение
synonyms:
- из аэропорта без пересадок
- удобно добираться из аэропорта
- близко к аэропорту
scope: hotel
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    transfers:
      type:
      - integer
      - 'null'
    scheduled_minutes:
      type:
      - number
      - 'null'
    night_service:
      type:
      - boolean
      - 'null'
    primary_unknown_reason:
      type:
      - string
      - 'null'
    airport_car_distance_km:
      type:
      - number
      - 'null'
  required:
  - available
  additionalProperties: true
methods:
- tool: prepared_observation
  params:
    kind: airport_transfer
    airport_radius_m: 500
    airport_walk_minutes: 10
    hotel_walk_minutes: 15
    snap_limit_m: 120
  rationale: Связность OSM маршрутов с 0–1 пересадкой; пешие участки по графу. Без
    GTFS время и ночное движение неизвестны.
ttl_days: 90
change_triggers:
- kind: source_snapshot_changed
search:
  kind: numeric
  field: transfers
  default_op: lte
  default_value: 0
  explain_ok: Дорога из аэропорта — есть данные по карте
  explain_bad: Условие не подтверждено рассчитанным значением; отсутствие данных остаётся
    неизвестным
hotelier_answerable: false
status: active
