id: evening_heat
version: 1
name_ru: Вечерняя солнечная экспозиция
description: Безразмерный прокси прямого солнца на вертикальном фасаде за три часа
  до заката, 15-е число месяца. Индекс 0–1 учитывает горизонт и угол падения; это
  не температура комнаты и не прогноз нагрева. Соседние этажи объединены только при
  одинаковом исходе порога; сохранены диапазоны минут и индекса. Поиск по индексу
  использует верхнюю границу диапазона, по минутам — нижнюю.
category: Солнце
synonyms:
- вечерний нагрев
- вечерняя жара
- меньше вечернего солнца
- без вечернего солнцепёка
- солнцепёк вечером
scope: floor_range
value_schema:
  type: object
  properties:
    available:
      type:
      - boolean
      - 'null'
    visible_minutes:
      type:
      - number
      - 'null'
    exposure_index:
      type:
      - number
      - 'null'
    visible_minutes_min:
      type:
      - number
      - 'null'
    visible_minutes_max:
      type:
      - number
      - 'null'
    exposure_index_min:
      type:
      - number
      - 'null'
    exposure_index_max:
      type:
      - number
      - 'null'
    value_semantics:
      type: string
  additionalProperties: true
methods:
- tool: geo_trait
  params:
    kind: evening_heat
  rationale: Безразмерный прокси прямого солнца на вертикальном фасаде за три часа
    до заката, 15-е число месяца. Индекс 0–1 учитывает горизонт и угол падения; это
    не температура комнаты и не прогноз нагрева.
ttl_days: 90
change_triggers:
- kind: building_change
  radius_m: 2000
search:
  kind: numeric
  field: exposure_index
  default_op: lte
  default_value: 0.35
  explain_ok: Индекс вечерней солнечной экспозиции не выше 0,35
  explain_bad: Индекс вечерней солнечной экспозиции выше 0,35
  unit: индекс 0–1
hotelier_answerable: true
status: active
